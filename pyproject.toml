[project]
name = "skylight-scraper"
version = "0.1.0"
description = "Synchronize Skylight Frame media to a local directory"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "requests>=2.32,<3",
]

[project.scripts]
skylight-scraper = "skylight_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
